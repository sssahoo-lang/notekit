services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: notekit
      POSTGRES_PASSWORD: notekit
      POSTGRES_DB: notekit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notekit"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
