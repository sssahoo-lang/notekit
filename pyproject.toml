[project]
name = "notekit"
version = "0.1.0"
description = "Grounded course-notes agent: cited study notes with measured faithfulness"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "langfuse>=3.0",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
notekit = "notekit.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notekit"]
