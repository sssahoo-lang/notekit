[project]
name = "notekit"
version = "0.1.0"
description = "Grounded course-notes agent: cited study notes with measured faithfulness"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "langfuse>=3.0",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
notekit = "notekit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
# uv clones installed files from its cache, and on macOS the clone inherits
# UF_HIDDEN from the cache entry. Python 3.11+ silently skips hidden .pth
# files, so the editable install's path file was present, valid, and ignored,
# surfacing as ModuleNotFoundError from a venv that had worked minutes earlier.
# Copying instead of cloning does not carry the flag.
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notekit"]
